# GiftDekeDekho — nginx rules for Living Photo scan performance
#
# WHY THIS EXISTS
# The same reason as nginx-hardening.conf: production runs nginx, and nginx
# never reads .htaccess. The compression and caching rules in the repo's
# .htaccess therefore apply to local XAMPP only, and are there so local testing
# behaves like the live server rather than because production needs them.
#
# Measured against https://www.giftdekedekho.com on 2026-09-21, nginx already
# does almost all of it — nothing below duplicates these:
#
#   .js     content-encoding: br  +  cache-control: max-age=315360000   correct
#   .mp4    cache-control: max-age=315360000, accept-ranges: bytes      correct
#   images  cache-control: max-age=315360000                           correct
#
# The exception is the compiled AR target files. nginx serves them as
# application/octet-stream, which its gzip/brotli type lists do not cover, and
# which its static-file caching rule does not match either. Measured the same
# day:
#
#   /public/uploads/ar-targets/all-frames.mind
#       11,052,649 bytes — no content-encoding, and no cache-control at all
#
# So every visit to /scan pulls 11MB uncompressed, every time, and a recipient
# opening their own /scan/{slug} re-downloads that frame's target file on each
# visit. These are feature descriptors rather than media: they gzip to roughly
# 55% of their size. The scanner fetches this file before it can recognise
# anything, so it is squarely on the path between opening the link and the
# video playing.
#
# Caching them is safe: every .mind URL carries a ?v=<mtime> stamp from asset(),
# so a recompiled target is a different URL and can never be served stale.
#
# WHERE IT GOES
# As with nginx-hardening.conf, the site user has no sudo, so this is not an
# /etc/nginx edit. In CloudPanel:
#   Sites → www.giftdekedekho.com → Vhost
# Paste this block inside the existing `server { ... }`, ABOVE the
# `location ~ \.php$` block, then save. CloudPanel tests the config and reloads
# nginx; if the test fails it refuses to save and the running site is untouched.

location ~* \.mind$ {
    # Feature data, not media — it compresses well, and nginx will not do it on
    # its own because the type is application/octet-stream.
    gzip on;
    gzip_types application/octet-stream;
    gzip_min_length 1024;
    gzip_vary on;

    # Brotli, if this nginx has the module — it already serves .js with br, so
    # it almost certainly does. Unlike Apache's <IfModule>, nginx has no way to
    # make a directive conditional: if saving fails with "unknown directive
    # brotli", delete these two lines and save again. gzip alone is most of the
    # benefit.
    brotli on;
    brotli_types application/octet-stream;

    # Matches what nginx already sends for .js, .mp4 and images on this server.
    expires max;
}
