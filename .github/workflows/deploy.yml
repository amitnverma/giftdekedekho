name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/giftdekedekho/htdocs/www.giftdekedekho.com
            echo "Before: $(git rev-parse --short HEAD)"
            git fetch origin main
            git reset --hard origin/main
            echo "After:  $(git rev-parse --short HEAD)"
            git --no-pager log -1 --pretty='Deployed commit %h — %s'
            # Warn about any files pinned with skip-worktree/assume-unchanged —
            # these are silently skipped by reset and can cause stale config.
            pinned="$(git ls-files -v | grep -iE '^[a-z]' || true)"
            if [ -n "$pinned" ]; then echo "NOTE: pinned files (not updated by deploy):"; echo "$pinned"; fi
            echo "Deployed at $(date)"
