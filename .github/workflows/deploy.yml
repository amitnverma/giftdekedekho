name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/giftdekedekho/htdocs/www.giftdekedekho.com
            echo "Before: $(git rev-parse --short HEAD)"
            git fetch origin main
            git reset --hard origin/main
            echo "After:  $(git rev-parse --short HEAD)"
            git --no-pager log -1 --pretty='Deployed commit %h — %s'

            # Clear PHP OPcache so updated .php files take effect immediately.
            # Reloads whichever php-fpm service exists; never fails the deploy.
            reloaded=""
            for svc in $(systemctl list-units --type=service --all 2>/dev/null \
                          | grep -oE 'php[0-9.]*-fpm\.service|php-fpm\.service' | sort -u); do
              if sudo -n systemctl reload "$svc" 2>/dev/null || systemctl reload "$svc" 2>/dev/null; then
                reloaded="$reloaded $svc"
              fi
            done
            if [ -n "$reloaded" ]; then
              echo "Reloaded PHP-FPM:$reloaded (OPcache cleared)"
            else
              echo "WARNING: could not reload php-fpm — if PHP changes don't appear, reload it manually or restart the web server."
            fi

            echo "Deployed at $(date)"
